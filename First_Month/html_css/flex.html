<html>
    <head>
        <style>
            .flex-container {
                display: flex;
                flex-flow: row wrap;
                align-items: center;
                border: 2px solid black;
                background-color: yellow;
                justify-content: center space-evenly;
                gap: 50px;
            }

            .flex-container > div.flex-container-inner { /* > it is a child combinator symbol */
                background-color: white;
                flex-flow: wrap;
                align-content: center;
                justify-content: center;
                align-items: center;
                gap: 20px;
                display: flex;
                margin: 9px;
                border: 2px solid black;
                font-size: 40px;
            }

            .num {
                display: flex;
                align-items: center;
                gap: 10px;
                border: 2px solid blue;
            }
        </style>
    </head>
    <body>
        <h1>Flex-flow property POC</h1>
        <div class="flex-container">
            <div class="flex-container-inner">
                <div class="num">1</div>
                <div class="num">2</div>
                <div class="num">2</div>
                <div class="num">2</div>
                <div class="num">2</div>
                <div class="num">2</div>
                <div class="num">2</div>
            </div>
            <div class="flex-container-inner">
                <div>3</div>
                <div>4</div>
                <div>2</div>
                <div>2</div>
                <div>2</div>
                <div>2</div>
                <div>2</div>
            </div>
        </div>
    </body>
</html>
