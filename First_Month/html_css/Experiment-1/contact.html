
<html>

<head>
  <title>Contact Us</title>
</head>

<body>
  <h1>Contact Information</h1>
  <p>Feel free to reach out to us. Here are our contact details:</p>
  <section class="contact-info">
    <h2>Contact Information</h2>
    <p>If you have any questions or need assistance, feel free to reach out to us. We're here to help!</p>
    <p><strong>Email:</strong> xyz@gmail.com</p>
    <p><strong>Phone:</strong> 111111</p>
    <p><strong>Address:</strong> Hyderabad</p> <!-- we can also give links but it is just for demo purposes-->
  </section>

  <section>
    <h2>Contact Form</h2>
    <form id="contact-form">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required><br>

      <label for="email">Your Email:</label>
      <input type="email" id="email" name="email" required><br>

      <label for="message">Your Message:</label><br>
      <textarea id="message" name="message" rows="4" required></textarea><br>

      <button type="button" onclick="submitForm">Submit</button><!--Inside a <button> element you can put text (and tags like <i>, <b>,
         <strong>, <br>, <img>, etc.). That is not possible with a button created with the <input> element!-->
    </form>
  </section>
</body>

</html>
