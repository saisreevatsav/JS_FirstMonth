<!DOCTYPE html>
<head>
    <title>
        POC of Bootstrap
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container mt-3">
        <h2>Registration</h2>
        <form class="needs-validation" id="form-id">
            <!-- text -->
            <label for="namef">First Name</label>
            <div class="row">
                <div class="col">
                    <span class="input-group-text-md">@</span>
                    <input type="text" class="form-control-md" placeholder="Enter your Name" name="namef">
                </div>
                <label for="namel">Last Name</label>
                <div class="col">
                    <input type="text" class="form-control-md" placeholder="Enter your Last name" name="namel">
                </div>
            </div>
            <br>
            <label for="email">Email</label>
            <div class="row">
                <div class="col">
                    <input type="email" class="form-control-md" placeholder="Enter your email" name="email">
                    <span class="input-group-text-md">@example.com</span>
                </div>
            </div>
            <br>
            <!--Select-->
            <label for="quality" class="form-label">Qualification</label>
            <select class="form-select form-select-md" name="quality">
                <option>B.Tech</option>
                <option>Inter</option>
                <option>Diploma</option>
                <option>10th Class</option>
            </select>
            <br>
            <!--Datalist-->
            <label for="role" class="form-label">Choose your Role</label>
            <input class="form-control" list="roles" name="role" id="role">
            <datalist id="roles">
                <option value="Sr. Software Engineer">
                <option value="Jr SE">
                <option value="Tech Lead">
                <option value="CTO">
                <option value="CEO">
            </datalist>
            <br>
            <!--Radio buttons-->
            <div class="form-check">
                <label class="form-label">Gender</label>
                <br>
                <label class="form-label" for="male">Male</label>
                <input type="radio" class="form-input-check" id="male" value="Male" name="gender">
                <label class="form-label" for="female">Female</label>
                <input type="radio" class="form-input-check" id="female" value="Female" name="gender">
            </div>
            <div class="form-floating mt-3 mb-3">
                <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
                <label for="pwd">Password</label>
            </div>
            <div class="container-fluid mt-3">
                <h1>Roles Avaliable</h1>
                <div class="row">
                    <div class="shadow-lg p-3 bg-lightgrey mb-4 w-25">Jr SE</div>
                    <div class="d-flex justify-content-end p-3 bg-dark text-white w-25">Sr. SE</div>
                    <div class="col-sm-3 p-3 bg-primary text-yellow text-uppercase">Tech Lead</div>
                    <div class="col-sm-3 p-3 bg-dark text-white">cto</div>
                </div>
            </div>
        </form>
    </div>

    <div class="container mt-3">
        <input type="submit" class="btn btn-primary text-black" id="form-submit">
    </div>

    <script>
        document.querySelector("#form-id").addEventListener("submit", function(event) {
            event.preventDefault();
        });
    </script>
</body>
