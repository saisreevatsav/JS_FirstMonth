<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Grid POC[1]</title>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* repeating the values, auto-fill is making the repeating changes like how many cells our screen fits, these are fraction units */
      grid-gap: 20px;
      grid-auto-rows: minmax(50px, auto); /* minmax is used to set the minimum and maximum height of the grid items */
      column-gap: 50px; /* row and column gaps are for gaps in gutters, gutters are the gaps between the columns in the grid layout. */
      row-gap: 30px;
    }

    .grid-item {
      background-color: rgb(120, 120, 148);
      border: 3px green solid;
      border-radius: 13px;
    }

    /* #grid-item-2 {
         grid-row-start: 2;
         grid-row-end: 3;
         grid-column-start: 2;
         grid-column-end: 3;
       } */

    #grid-item-1 {
      grid-column-start: 1;
      grid-column-end: 5;
    }

    .grid-item-nested-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .nested-grid-item {
      border: greenyellow solid 2px;
      border-radius: 5px;
      background-color: lightgrey;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="grid-item-nested-container" id="grid-item-1">
      <div class="nested-grid-item">d d 1</div>
      <div class="nested-grid-item">d d 2</div>
      <div class="nested-grid-item">d d 3</div>
    </div>
    <div class="grid-item" id="grid-item-2">d 2</div>
    <div class="grid-item">d 3</div>
    <div class="grid-item">d 4</div>
    <div class="grid-item">d 5</div>
  </div>
</body>
</html>
