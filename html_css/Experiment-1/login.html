<!DOCTYPE html>
<html lang="en"> <!--In the context of HTML, the attribute lang="en" is used to specify the language of the content within the HTML document. 
  The value "en" is an abbreviation for English. -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
       height: 100vh;           /* <!--viewport height -vh allows you to size elements relative to the height of the browser window --> */
      margin: 0;
    } 

    form {
      width: 300px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }

    button {
      background-color: #4caf50;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <form id="login-form">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <button type="button" onclick="login()">Login</button>
  </form>

  <script>
    function login() {
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;

      if (username == 'sai sreevatsav' && password == 'sai') {
        alert('Login successful!');
      } else {
        alert('Invalid username or password. Please try again.');
      } 
    }
  </script><!--Just for demo purposes, vh means viewport height-->
</body>

</html>
