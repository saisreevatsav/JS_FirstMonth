<html>
  <title>
    HTML core concepts
  </title>
  <head>
    <link rel="stylesheet" type="text/css" href="./total_css.css" />
  </head>
  <body>
    <header>
      <!-- /* The REL attribute is used to define the relationship between the linked file and the HTML document. REL=StyleSheet **specifies a persistent or preferred style** */ -->
      <h1>POC of HTML and CSS</h1>
      <style>
        .forms {
          display: flex;
          flex-direction: column;
          align-items: center;
          align-content: center;
        }
      </style>
    </header>

    <div class="forms" id="forms">
      <h2>User Form</h2>
      <form>
        <label for="name">Name</label>
        <input
          type="text"
          placeholder="enter your name"
          name="name"
          id="name"
          onselect="mytextselect()"
          required
        /><br /><br />

        <label for="email">email</label>
        <input
          type="email"
          placeholder="enter your email"
          name="email"
          id="email"
          onselect="mytextselect()"
          required
        /><br /><br />

        <label for="phone">phone</label>
        <input
          type="number"
          placeholder="enter your phone number"
          onselect="mytextselect()"
          name="phone"
          id="phone"
        /><br /><br />

        <label for="about-you">About you</label>
        <input type="textarea" placeholder="about you" name="you" id="about-you" /><br />

        <!-- Radio --><br />
        <label>Gender</label><br />
        <label>
          <input type="radio" name="gender" value="male" /> Male<br />
        </label>
        <label>
          <input type="radio" name="gender" value="female" />Female<br />
        </label><br />

        <!-- Checkbox -->
        <label>Qualifications</label><br />
        <input type="checkbox" id="b-tech" name="b-tech" />
        <label for="b-tech">B.Tech</label><br />
        <input type="checkbox" id="inter" name="inter" />
        <label for="inter">Inter</label><br />
        <input type="checkbox" id="tenth-class" name="tenth-class" />
        <label for="tenth-class">10th Class</label><br />
        <input type="checkbox" id="all" name="all" />
        <label for="all">All</label><br /><br />

        <!-- password -->
        <label>Create Password</label><br />
        <input
          type="password"
          id="first-password"
          value="pass"
          placeholder="enter password"
          onmouseover="myfocus()"
          onmouseleave="myoutfocus()"
          required
        /><br />
        <label for="first-password"></label><br />
        <input
          type="password"
          id="second-password"
          placeholder="re-type password"
          onmouseover="myfocus()"
          onmouseleave="myoutfocus()"
          required
        />
        <label for="second-password"></label><br /><br />

        <!-- Submit -->
        <input type="submit" id="submit-btn" onclick="myclick(this.id)" /><br /><br />

        <!-- reset -->
        <input type="reset" id="reset-btn" onclick="myclick(this.id)" />
      </form>

      <!-- Article & Section -->
      <section>
        <article>
          <h3>Describing yourself</h3>
          <p>
            Describing yourself is more important to analyze your communication skills and
            confidence.
          </p>
        </article>
      </section>

      <!-- Function -->
      <script>
        document.getElementById("forms").addEventListener("submit", function (event) {
          event.preventDefault(); //this makes the submit button not to reload the page.
          let name = document.getElementById("name").value;
        });

        function myfocus() {
          document.getElementById("first-password").style.background = "green";
          document.getElementById("second-password").style.background = "green";
        }

        function myoutfocus() {
          document.getElementById("first-password").style.background = "white";
          document.getElementById("second-password").style.background = "white";
        }

        function myclick(id) {
          if (id === "submit-btn") {
            window.open("./table_links_list.html", "_blank");
          } else {
            location.reload();
          }
        }

        function mytextselect() {
          alert("don't edit too many times");
        }
      </script>
    </div>

    <aside class="sider">
      <h3>About the Form</h3>
      <p>The form is to know you better. To increase user experience.</p>
    </aside>

    <footer>
      <p>&copy; Sai Sreevatsav K 2025</p>
    </footer>
  </body>
</html>
